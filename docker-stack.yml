# Docker Stack configuration for Docker Swarm deployment
# Use: docker stack deploy -c docker-stack.yml thoth

version: '3.8'

services:
  # === BACKEND SERVICE ===
  backend:
    image: ${DOCKER_REGISTRY:-tylconsulting}/thoth-backend:${IMAGE_VERSION:-latest}
    networks:
      - thoth-network
    volumes:
      - type: bind
        source: ${THOTH_DATA_PATH}/backend_db
        target: /app/backend_db
      - type: bind
        source: ${THOTH_DATA_PATH}/shared
        target: /app/data
      - type: bind
        source: ${THOTH_DATA_PATH}/logs
        target: /app/logs
      - type: bind
        source: ${THOTH_DATA_PATH}/static
        target: /vol/static
      - type: bind
        source: ${THOTH_DATA_PATH}/media
        target: /vol/media
      - type: bind
        source: ${THOTH_DATA_PATH}/data_exchange
        target: /app/data_exchange
      - type: bind
        source: ${THOTH_DATA_PATH}/secrets
        target: /vol/secrets
    environment:
      - HOST_IP=host.docker.internal
      - DOCKER_ENV=production
      - DOCKER_CONTAINER=true
      - AUTO_GENERATE_SECRETS=true
      - AUTO_CREATE_SCHEMA=${AUTO_CREATE_SCHEMA:-false}
      - FRONTEND_URL=http://localhost:${FRONTEND_PORT:-3040}
      # External PostgreSQL Connection
      - DB_ENGINE=${DB_ENGINE}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_SCHEMA=${DB_SCHEMA}
    secrets:
      - thoth_env_config

    configs:
      - source: thoth_env_docker
        target: /app/.env.docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=backend"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G



  # === FRONTEND SERVICE ===
  frontend:
    image: ${DOCKER_REGISTRY:-tylconsulting}/thoth-frontend:${IMAGE_VERSION:-latest}
    networks:
      - thoth-network
    ports:
      - target: 3000
        published: ${FRONTEND_PORT:-3040}
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: ${THOTH_DATA_PATH}/frontend_cache
        target: /app/.next/cache
      - type: bind
        source: ${THOTH_DATA_PATH}/data_exchange
        target: /app/data_exchange
        read_only: true
      - type: bind
        source: ${THOTH_DATA_PATH}/secrets
        target: /vol/secrets
        read_only: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DJANGO_SERVER=http://proxy:80
      - SQL_GENERATOR_URL=http://sql-generator:8020
      - DOCKER_CONTAINER=true
      # Build-time embedded (for client-side fallback)
      - NEXT_PUBLIC_DJANGO_SERVER=http://localhost:${WEB_PORT}
      - NEXT_PUBLIC_SQL_GENERATOR_URL=http://localhost:${SQL_GENERATOR_PORT}
      # Runtime variables for /api/config endpoint
      # Runtime variables for /api/config endpoint
      # The frontend container needs to know where the Proxy is (Gateway)
      # In execution, this points to the external URL of the Proxy
      - RUNTIME_BACKEND_URL=http://localhost:${WEB_PORT}
      - RUNTIME_SQL_GENERATOR_URL=http://localhost:${SQL_GENERATOR_PORT}
    secrets:
      - thoth_env_config
    configs:
      - source: thoth_env_docker
        target: /app/.env.docker
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=frontend"
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # === SQL GENERATOR SERVICE ===
  sql-generator:
    image: ${DOCKER_REGISTRY:-tylconsulting}/thoth-sql-generator:${IMAGE_VERSION:-latest}
    networks:
      - thoth-network
    ports:
      - target: 8020
        published: ${SQL_GENERATOR_PORT:-8020}
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: ${THOTH_DATA_PATH}/shared
        target: /app/data
      - type: bind
        source: ${THOTH_DATA_PATH}/logs
        target: /app/logs
      - type: bind
        source: ${THOTH_DATA_PATH}/data_exchange
        target: /app/data_exchange
      - type: bind
        source: ${THOTH_DATA_PATH}/secrets
        target: /vol/secrets
        read_only: true
    environment:
      - DOCKER_CONTAINER=true
      - PORT=8020
      - DJANGO_SERVER=http://backend:8000
      - VECTOR_DB_HOST=thoth-qdrant
      - VECTOR_DB_PORT=6333
      - DB_ROOT_PATH=/app/data
    secrets:
      - thoth_env_config
    configs:
      - source: thoth_env_docker
        target: /app/.env.docker
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=sql-generator"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # === PROXY SERVICE ===
  proxy:
    image: ${DOCKER_REGISTRY:-tylconsulting}/thoth-proxy:${IMAGE_VERSION:-latest}
    networks:
      - thoth-network
    ports:
      - target: 80
        published: ${WEB_PORT:-7010}
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: ${THOTH_DATA_PATH}/static
        target: /vol/static
        read_only: true
      - type: bind
        source: ${THOTH_DATA_PATH}/media
        target: /vol/media
        read_only: true
      - type: bind
        source: ${THOTH_DATA_PATH}/data_exchange
        target: /vol/data_exchange
        read_only: true
    environment:
      - APP_HOST=backend
      - APP_PORT=8000
      - FRONTEND_HOST=frontend
      - FRONTEND_PORT=3000
      - SQL_GEN_HOST=sql-generator
      - SQL_GEN_PORT=8020
      - DEBUG=False
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=proxy"
      replicas: 2
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # === MERMAID SERVICE ===
  mermaid-service:
    image: ${DOCKER_REGISTRY:-tylconsulting}/thoth-mermaid-service:${IMAGE_VERSION:-latest}
    networks:
      - thoth-network
    ports:
      - target: 8001
        published: ${MERMAID_SERVICE_PORT:-8003}
        protocol: tcp
        mode: ingress
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=mermaid"
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # === VECTOR DATABASE SERVICE ===
  thoth-qdrant:
    image: qdrant/qdrant:latest
    networks:
      - thoth-network
    ports:
      - target: 6333
        published: ${QDRANT_PORT:-6333}
        protocol: tcp
        mode: ingress
    volumes:
      - type: bind
        source: ${THOTH_DATA_PATH}/qdrant_data
        target: /qdrant/storage
    deploy:
      labels:
        - "com.docker.stack.namespace=thothai-swarm"
        - "com.thoth.project=thoth-ai"
        - "com.thoth.service=qdrant"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M



networks:
  thoth-network:
    external: true
    name: ${STACK_NAME:-thothai-swarm}_thoth-network

secrets:
  thoth_env_config:
    external: true
    name: ${STACK_NAME:-thothai-swarm}_thoth_env_config


configs:
  thoth_env_docker:
    external: true
    name: ${STACK_NAME:-thothai-swarm}_thoth_env_docker
