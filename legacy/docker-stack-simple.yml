version: "3.8"

services:
  backend:
    image: ${REGISTRY_URL}/thoth-backend:${VERSION:-latest}
    env_file: .env.docker
    environment:
      HOST_IP: host.docker.internal
      DOCKER_ENV: production
      DB_NAME_DOCKER: /app/backend_db/db.sqlite3
      FRONTEND_URL: http://proxy:${WEB_PORT:-7400}
      DOCKER_CONTAINER: "true"
    volumes:
      - thoth-backend-db:/app/backend_db
      - thoth-shared-data:/app/data
      - thoth-logs:/app/logs
      - backend-static:/vol/static
      - backend-media:/vol/media
      - ./config.yml.local:/app/config.yml.local:ro
      - ./data_exchange:/app/data_exchange
    networks:
      - thoth-network

  frontend:
    image: ${REGISTRY_URL}/thoth-frontend:${VERSION:-latest}
    env_file: .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DJANGO_SERVER: http://proxy:80
      SQL_GENERATOR_URL: http://sql-generator:8020
      DOCKER_CONTAINER: "true"
      NEXT_PUBLIC_DJANGO_SERVER: http://proxy:80
      NEXT_PUBLIC_SQL_GENERATOR_URL: http://sql-generator:8020
    ports:
      - "${FRONTEND_PORT:-7401}:3000"
    volumes:
      - frontend-cache:/app/.next/cache
      - ./frontend/public:/app/public:ro
      - ./data_exchange:/app/data_exchange:ro
    networks:
      - thoth-network
    depends_on:
      - backend
      - sql-generator

  sql-generator:
    image: ${REGISTRY_URL}/thoth-sql-generator:${VERSION:-latest}
    env_file: .env.docker
    environment:
      DOCKER_CONTAINER: "true"
      PORT: 8020
      DJANGO_SERVER: http://backend:8000
      VECTOR_DB_HOST: thoth-qdrant
      VECTOR_DB_PORT: 6333
      DB_ROOT_PATH: /app/data
    ports:
      - "${SQL_GENERATOR_PORT:-7402}:8020"
    volumes:
      - thoth-shared-data:/app/data
      - thoth-logs:/app/logs
      - ./data_exchange:/app/data_exchange
    networks:
      - thoth-network
    depends_on:
      - backend
      - thoth-qdrant

  proxy:
    image: ${REGISTRY_URL}/thoth-proxy:${VERSION:-latest}
    ports:
      - "${WEB_PORT:-7400}:80"
    networks:
      - thoth-network
    depends_on:
      - backend
      - frontend
      - sql-generator

  thoth-mermaid-service:
    image: ${REGISTRY_URL}/thoth-mermaid-service:${VERSION:-latest}
    ports:
      - "${MERMAID_SERVICE_PORT:-7403}:8001"
    networks:
      - thoth-network

  thoth-qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - thoth-network

volumes:
  thoth-backend-db:
  thoth-shared-data:
  thoth-logs:
  backend-static:
  backend-media:
  frontend-cache:
  qdrant-data:

networks:
  thoth-network:
    driver: overlay
