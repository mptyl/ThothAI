name: local-thothai

services:
  # === MERMAID SERVICE ===
  mermaid-service:
    build:
      context: ./docker/mermaid-service
      dockerfile: Dockerfile
    image: thoth-mermaid-service:local
    container_name: mermaid-service
    restart: always
    ports:
      - "${MERMAID_SERVICE_PORT:-8003}:8001"
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:8001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # === VECTOR DATABASE SERVICE ===
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-thoth
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"200 OK\"'" ]
      interval: 30s
      timeout: 10s
      retries: 3
